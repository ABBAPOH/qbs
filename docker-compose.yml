version: "3.7"

x-default-service: &linux
  working_dir: /qbs
  environment:
    - BUILD_OPTIONS
    - QTEST_FUNCTION_TIMEOUT
    - QBS_AUTOTEST_PROFILE
    - QBS_TEST_SOURCE_ROOT
    - WITH_ARCHIVE
    - WITH_TESTS
  volumes:
    - .:/qbs
    - ~/.ccache:/home/devel/.ccache
    - /cores:/cores
  network_mode: bridge
  cap_add:
      - SYS_PTRACE
  ulimits:
    core:
      soft: -1
      hard: -1

services:
  resolute-qt6: &resolute-qt6
    << : *linux
    hostname: resolute-qt6
    image: ${DOCKER_USER:-qbsbuild}/qbsdev:resolute-qt6-6.11.2_3.0.3-0
    build:
      dockerfile: docker/resolute/Dockerfile
      context: .
      args:
        QT_VERSION: 6.11.2
        QBS_VERSION: 3.0.3

  resolute-qt5: &resolute-qt5
    << : *linux
    hostname: resolute-qt5
    image: ${DOCKER_USER:-qbsbuild}/qbsdev:resolute-qt5-5.12.2_3.0.3-0
    build:
      dockerfile: docker/resolute/Dockerfile
      context: .
      args:
        QT_VERSION: 5.15.2
        QBS_VERSION: 3.0.3

  resolute:
    << : *resolute-qt6

  resolute-android-65:
    << : *linux
    hostname: resolute-android
    image: ${DOCKER_USER:-qbsbuild}/qbsdev:resolute-android-6.5.0-0
    build:
      dockerfile: docker/resolute/test-android.Dockerfile
      context: .
      args:
        QT_VERSION: 6.5.0
        ANDROID_NDK_VERSION: 25.1.8937393

  resolute-android-515:
    << : *linux
    hostname: resolute-android
    image: ${DOCKER_USER:-qbsbuild}/qbsdev:resolute-android-5.15.2-0
    build:
      dockerfile: docker/resolute/test-android.Dockerfile
      context: .
      args:
        QT_VERSION: 5.15.2
        ANDROID_NDK_VERSION: 23.0.7599858

  resolute-android-ndk-r25:
    << : *linux
    hostname: resolute-android
    image: ${DOCKER_USER:-qbsbuild}/qbsdev:resolute-android-ndk-r25-0
    build:
      dockerfile: docker/resolute/test-android-no-qt.Dockerfile
      context: .
      args:
        ANDROID_NDK_VERSION: 25.1.8937393

  resolute-baremetal:
    << : *linux
    hostname: resolute-baremetal
    image: ${DOCKER_USER:-qbsbuild}/qbsdev:resolute-baremetal-0
    build:
      dockerfile: docker/resolute/test-baremetal.Dockerfile
      context: .

  resolute-qt6-static:
    << : *linux
    hostname: resolute-qt6-static
    image: ${DOCKER_USER:-qbsbuild}/qbsdev:resolute-qt6-static-6.11.2_3.0.3-0
    build:
      dockerfile: docker/resolute/test-qt6-static.Dockerfile
      context: .
      args:
        QT_VERSION: 6.11.2
        QBS_VERSION: 3.0.3

  resolute-qt6-wasm:
    << : *linux
    hostname: resolute-qt6-wasm
    image: ${DOCKER_USER:-qbsbuild}/qbsdev:resolute-qt6-wasm-6.7.3-0
    build:
      dockerfile: docker/resolute/test-qt6-wasm.Dockerfile
      context: .
      args:
        QT_VERSION: 6.7.3
        EMSCRIPTEN_VERSION: 3.1.50

  leap:
    << : *linux
    hostname: leap
    image: ${DOCKER_USER:-qbsbuild}/qbsdev:leap-5.15.2_1.20.1-1
    build:
      dockerfile: docker/leap/Dockerfile
      context: .
      args:
        QT_VERSION: 5.15.2
        QTCREATOR_VERSION: 5.0.3

  windows:
    image: ${DOCKER_USER:-qbsbuild}/qbsdev:windowsservercore-6.8.3_3.0.1-1
    build:
      dockerfile: docker/windowsservercore/Dockerfile
      context: .
      args:
        QT_VERSION: 6.8.3
        QBS_VERSION: 3.0.1
    working_dir: 'C:/qbs'
    environment:
      - BUILD_OPTIONS
      - WITH_DOCS
    volumes:
      - type: bind
        source: .
        target: C:\qbs
      - type: bind
        source: ~/.ccache
        target: C:\.ccache
    network_mode: nat
